# LeaseGuard backend stack for one DigitalOcean Droplet (or your laptop).
#   cp .env.example .env   # fill it in
#   docker compose up -d --build
# Public: only Caddy (80/443). Temporal UI: ssh -L 8233:localhost:8233 root@<droplet-ip>

x-app: &app
  build: .
  env_file: .env
  environment:
    TEMPORAL_ADDRESS: temporal:7233
  restart: unless-stopped
  depends_on:
    temporal:
      condition: service_healthy

services:
  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    volumes:
      # Mounted on the image's own home dir so the volume is owned by the non-root user
      - temporal-data:/home/temporal
    ports:
      - "127.0.0.1:8233:8233" # UI, localhost only (use an SSH tunnel)
      - "127.0.0.1:7233:7233" # gRPC, localhost only (for running api/worker outside Docker)
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    <<: *app
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000" # local debugging only; Caddy is the public entrypoint

  worker:
    <<: *app
    command: ["python", "worker.py"]
    # Root so it can read the mounted SSH key that `jl exec` uses to reach GPU boxes.
    user: root
    volumes:
      - ./secrets/ssh:/root/.ssh:ro

  bot:
    <<: *app
    command: ["python", "-m", "api.telegram_bot"]
    profiles: ["telegram"] # enable with: docker compose --profile telegram up -d

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api
    restart: unless-stopped
    profiles: ["public"] # enable on the Droplet: docker compose --profile public up -d

volumes:
  temporal-data:
  caddy-data:
